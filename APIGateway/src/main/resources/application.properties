server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[1].id=posts-service
spring.cloud.gateway.routes[1].uri=lb://POSTS-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/posts/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[2].id=connections-service
spring.cloud.gateway.routes[2].uri=lb://CONNECTIONS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/connections/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

